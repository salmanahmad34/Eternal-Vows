<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Eternal Vowz</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <!-- Supabase & Init -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-init.js" defer></script>
    
    <script src="dashboard.js" defer></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body style="background-color: var(--bg-primary); display: flex; align-items: center; justify-content: center; height: 100vh;">

    <div class="form-card" style="width: 100%; max-width: 500px; padding: 40px;">
        <div style="text-align: center; margin-bottom: 30px;">
            <a href="dashboard.html" class="brand-logo" style="justify-content: center; margin-bottom: 20px; font-size: 2rem;"><img src="favicon.svg" alt="EV Logo" style="height: 32px; width: 32px; margin-right: 8px; border-radius: 6px; vertical-align: middle;"> Eternal Vowz</a>
            <h2 style="font-family: var(--font-body); font-size: 1.5rem;">Complete Your Purchase</h2>
        </div>

        <div style="background: #FAFAF9; padding: 24px; border-radius: var(--radius-md); border: 1px solid var(--border-color); margin-bottom: 30px;">
            <h3 style="font-family: var(--font-body); font-size: 1.1rem; margin-bottom: 16px;">Order Summary</h3>
            
            <div style="display: flex; justify-content: space-between; margin-bottom: 12px; color: var(--text-sec); font-size: 0.95rem;">
                <span id="checkout-item-name">1 Premium Digital Invitation</span>
                <span id="checkout-base-price">₹39</span>
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 16px; color: var(--text-sec); font-size: 0.95rem; border-bottom: 1px solid var(--border-color); padding-bottom: 16px;">
                <span>GST (5%)</span>
                <span id="checkout-gst">₹2</span>
            </div>
            
            <div style="display: flex; justify-content: space-between; font-weight: 600; font-size: 1.2rem;">
                <span>Total</span>
                <span id="checkout-total-price" style="color: var(--accent-gold);">₹41</span>
            </div>
        </div>

        <button id="pay-btn" class="btn-primary btn-block" style="padding: 16px; font-size: 1.1rem; margin-bottom: 20px;">
            <i class="fas fa-lock"></i> Pay Now with Razorpay
        </button>

        <p style="text-align: center; color: var(--text-sec); font-size: 0.85rem;">
            Secured by: <i class="fas fa-shield-alt"></i> Razorpay<br>
            <a href="create.html" style="text-decoration: underline; display: inline-block; margin-top: 10px;">Go Back</a>
        </p>
    </div>

    <script>
        document.getElementById('pay-btn').addEventListener('click', async () => {
            const btn = document.getElementById('pay-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            btn.disabled = true;

            try {
                // 1. Create order on backend
                const response = await fetch('/create-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: 39, receipt: 'inv_12345' })
                });
                
                const order = await response.json();
                
                if (!order || !order.id) {
                    throw new Error('Failed to create order');
                }

                // 2. Initialize Razorpay Checkout
                const options = {
                    key: 'rzp_test_T13Kjq8NDXfZwu', // Your Test API Key
                    amount: order.amount,
                    currency: order.currency,
                    name: "Eternal Vowz",
                    description: "Standard Package",
                    image: "favicon.svg",
                    order_id: order.id,
                    handler: function (response) {
                        alert(`Payment successful! Payment ID: ${response.razorpay_payment_id}`);
                        // Redirect to dashboard or success page
                        window.location.href = "dashboard.html";
                    },
                    prefill: {
                        name: "User",
                        email: "user@example.com",
                        contact: "9999999999"
                    },
                    theme: {
                        color: "#D4AF37"
                    }
                };

                const rzp1 = new Razorpay(options);
                rzp1.on('payment.failed', function (response){
                    alert("Payment failed! " + response.error.description);
                });
                rzp1.open();

            } catch (error) {
                console.error(error);
                alert("Something went wrong initializing payment.");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
