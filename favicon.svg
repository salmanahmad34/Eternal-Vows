<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="128" height="128">
  <!-- Left Ring -->
  <circle cx="38" cy="50" r="24" fill="none" stroke="#121212" stroke-width="5" />
  <!-- Right Ring -->
  <circle cx="62" cy="50" r="24" fill="none" stroke="#121212" stroke-width="5" />
