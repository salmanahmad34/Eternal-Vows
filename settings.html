<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Eternal Vowz</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <!-- Supabase & Init -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-init.js" defer></script>

    <script src="dashboard.js" defer></script>
</head>
<body>

    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar">
            <a href="index.html" class="brand-logo"><img src="favicon.svg" alt="EV Logo"> Eternal Vowz</a>
            <nav class="menu-links">
                <p class="menu-section-title">Main Navigation</p>
                <a href="dashboard.html" class="menu-item">
                    <i class="fas fa-home"></i> Home
                </a>
                <a href="create.html" class="menu-item">
                    <i class="fas fa-magic"></i> Create
                </a>
                <a href="invitations.html" class="menu-item">
                    <i class="fas fa-envelope-open-text"></i> Invitations
                    <span class="badge-count">3</span>
                </a>
                <a href="profile.html" class="menu-item">
                    <i class="fas fa-user"></i> Profile
                </a>

                <p class="menu-section-title" style="margin-top: 30px;">Settings</p>
                <a href="settings.html" class="menu-item active">
                    <i class="fas fa-cog"></i> Settings
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="index.html" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <button class="mobile-toggle" id="mobile-toggle">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="user-profile">
                    <div class="user-avatar"></div>
                    <span class="user-name">Priya S.</span>
                </div>
            </header>

            <div class="content-area">
                <div class="page-header">
                    <h1 class="page-title">Settings</h1>
                </div>

                <div class="dashboard-grid" style="grid-template-columns: 1fr; max-width: 800px;">
                    
                    <!-- Notification Preferences -->
                    <div class="panel">
                        <h3>Notification Preferences</h3>
                        <div style="display: flex; flex-direction: column; gap: 16px;">
                            <label style="display: flex; align-items: center; gap: 12px; cursor: pointer;">
                                <input type="checkbox" checked> 
                                <div>
                                    <span style="font-weight: 500; display: block;">Email Notifications</span>
                                    <span style="font-size: 0.85rem; color: var(--text-sec);">Receive updates about new invitations and shares.</span>
                                </div>
                            </label>
                            <label style="display: flex; align-items: center; gap: 12px; cursor: pointer;">
                                <input type="checkbox" checked> 
                                <div>
                                    <span style="font-weight: 500; display: block;">Weekly Summary</span>
                                    <span style="font-size: 0.85rem; color: var(--text-sec);">Get a weekly email about your invitation performance.</span>
                                </div>
                            </label>
                            <label style="display: flex; align-items: center; gap: 12px; cursor: pointer; opacity: 0.6;">
                                <input type="checkbox" disabled> 
                                <div>
                                    <span style="font-weight: 500; display: block;">WhatsApp Notifications <span class="badge-count">Coming Soon</span></span>
                                    <span style="font-size: 0.85rem; color: var(--text-sec);">Get direct messages when guests view your invite.</span>
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- Privacy & Security -->
                    <div class="panel">
                        <h3>Privacy & Security</h3>
                        <div style="display: flex; flex-direction: column; gap: 24px;">
                            <div>
                                <h4 style="font-size: 1rem; margin-bottom: 8px;">Password Management</h4>
                                <button class="btn-secondary" style="padding: 8px 16px;">Change Password</button>
                            </div>
                            <div style="border-top: 1px solid var(--border-color); padding-top: 24px;">
                                <h4 style="font-size: 1rem; margin-bottom: 8px;">Two-Factor Authentication</h4>
                                <button class="btn-secondary" style="padding: 8px 16px;" disabled>Enable 2FA <span class="badge-count" style="margin-left: 8px;">Coming Soon</span></button>
                            </div>
                            <div style="border-top: 1px solid var(--border-color); padding-top: 24px;">
                                <h4 style="font-size: 1rem; margin-bottom: 8px;">Data & Privacy</h4>
                                <div style="display: flex; gap: 12px;">
                                    <button class="btn-secondary" style="padding: 8px 16px;">Download Your Data</button>
                                    <button class="btn-secondary" style="padding: 8px 16px; color: #ef4444; border-color: #ef4444;">Delete Account</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Account Preferences -->
                    <div class="panel">
                        <h3>Account Preferences</h3>
                        <div class="split-layout">
                            <div class="form-group">
                                <label>Language</label>
                                <select class="form-control">
                                    <option>English</option>
                                    <option>Hindi</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Timezone</label>
                                <select class="form-control">
                                    <option>IST (UTC+5:30)</option>
                                    <option>GMT (UTC+0:00)</option>
                                </select>
                            </div>
                            <div class="form-group" style="grid-column: span 2;">
                                <label>Theme</label>
                                <select class="form-control">
                                    <option>Light Mode</option>
                                    <option>Dark Mode (Coming Soon)</option>
                                    <option>System Auto</option>
                                </select>
                            </div>
                        </div>
                        <button class="btn-primary">Save Preferences</button>
                    </div>

                </div>
            </div>
        </main>
    </div>

</body>
</html>
